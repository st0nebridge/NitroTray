[package]
name = "nitrotray"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
description = "Compact NitroSense tray companion for Acer Nitro laptops: telemetry, fan and performance modes, graph tray icons."
authors = ["Brandon Stonebridge"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/st0nebridge/NitroTray"
publish = false

[lib]
name = "nitrotray"
path = "src/lib.rs"

[[bin]]
name = "NitroTray"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target."cfg(windows)".dependencies]
global-hotkey = "0.8.0"
tao = "0.36.0"
tray-icon = "0.24.2"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Variant", "Win32_System_Ole", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Power", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
windows-service = "0.8.1"
wry = "0.56.1"

[[bin]]
name = "NitroTrayService"
path = "src/bin/nitrotray_service.rs"

[dev-dependencies]
# Encodes docs/images/tray-icons@6x.png in tests/unit/docs_images_test.rs (already in the tree via tray-icon).
png = "0.18.1"
